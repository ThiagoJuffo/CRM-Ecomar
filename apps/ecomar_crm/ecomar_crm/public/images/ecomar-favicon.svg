<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 112" width="120" height="112" role="img" aria-label="Ecomar Engenharia">
  <!-- Icone da Ecomar (folha + casa com painel solar). Recriacao vetorial
       fiel ao conceito da marca; troque pelo arquivo oficial se desejar. -->
  <!-- Folha (cradle) -->
  <path d="M6 76 Q60 44 116 60 Q60 106 6 76 Z" fill="#1E9E1E"/>
  <!-- Nervura da folha -->
  <path d="M14 74 Q64 70 108 64" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.35" stroke-linecap="round"/>
  <!-- Corpo da casa (branco) -->
  <rect x="43" y="50" width="34" height="28" fill="#ffffff"/>
  <!-- Telhado / painel solar (verde) -->
  <polygon points="38,52 60,28 82,52" fill="#1E9E1E"/>
  <!-- Celulas do painel solar (linhas brancas no telhado) -->
  <g stroke="#ffffff" stroke-width="1.6" opacity="0.9">
    <line x1="52" y1="40" x2="74" y2="40"/>
    <line x1="47" y1="46" x2="79" y2="46"/>
    <line x1="62" y1="30" x2="62" y2="52"/>
    <line x1="70" y1="34" x2="70" y2="52"/>
  </g>
  <!-- Porta (verde) -->
  <rect x="54" y="60" width="12" height="18" fill="#1E9E1E"/>
</svg>
