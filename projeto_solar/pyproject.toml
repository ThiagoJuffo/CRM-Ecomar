[project]
name = "projeto_solar"
version = "0.1.0"
description = "Pré-projeto fotovoltaico automatizado da Ecomar: paginação, strings e unifilar"
requires-python = ">=3.10"
dependencies = ["shapely>=2.0", "ezdxf>=1.1", "matplotlib>=3.7", "requests>=2.28", "numpy>=1.24", "scipy>=1.10", "tifffile>=2023.1", "pillow>=9.0"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
projeto-solar = "projeto_solar.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["projeto_solar*"]

[tool.setuptools.package-data]
projeto_solar = ["catalogo/*.json"]
